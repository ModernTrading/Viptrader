<style>
  :root {
    --bg: #FFFFFF; --panel: #F5F6F8; --line: rgba(16,24,40,.12);
    --text: #111827; --muted: #5A6472;
    --gold: #E9BA4B; --gold-soft: rgba(201,151,31,.55); --ink-on-gold: #1A1305;
    --green: #2DBE5C; --red: #E5484D;
    --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --body: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); color-scheme: light; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; align-items: center; }
  .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 20px; }

  .hero { text-align: center; padding: 28px 0 36px; }
  .logo {
    position: relative; overflow: hidden;
    margin: 0 auto 22px; width: 210px; aspect-ratio: 1 / 1;
    border-radius: 50%; padding: 5px;
    background: linear-gradient(135deg, #F8DE8A, #B98A21 50%, #F4CF6A);
    box-shadow: 0 18px 40px -18px rgba(17,24,39,.5);
    animation: pop .7s cubic-bezier(.2,.9,.3,1.2) both, float 4s ease-in-out .7s infinite, glow 3s ease-in-out .7s infinite;
  }
  .logo::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 40%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-18deg);
    animation: glint 3.6s ease-in-out 1.2s infinite;
    pointer-events: none;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes glow {
    0%, 100% { box-shadow: 0 18px 40px -18px rgba(17,24,39,.5), 0 0 0 0 rgba(233,186,75,0); }
    50%      { box-shadow: 0 22px 44px -16px rgba(17,24,39,.5), 0 0 26px 2px rgba(233,186,75,.55); }
  }
  @keyframes glint { 0%, 60% { left: -70%; } 100% { left: 130%; } }
  @media (prefers-reduced-motion: reduce) { .logo, .logo::after { animation: none !important; } }
  .logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 9vw, 48px); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 18px; margin: 0 auto 28px; max-width: 24em; }

  .btn {
    position: relative; overflow: hidden; isolation: isolate;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; max-width: 380px; min-height: 58px; padding: 0 12px; white-space: nowrap;
    background: var(--gold); color: var(--ink-on-gold);
    border: 1px solid #C9971F;
    font-family: var(--body); font-weight: 700; font-size: clamp(15px, 4.4vw, 18px); text-decoration: none;
    border-radius: 14px;
    box-shadow: 0 10px 24px -10px rgba(201,151,31,.9);
    animation: pulse 2.2s ease-out infinite;
    transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
  }
  /* shine sweep */
  .btn::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -70%; width: 45%; z-index: -1;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.75), transparent);
    transform: skewX(-18deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  .btn:hover { background: #F2C965; transform: translateY(-3px); box-shadow: 0 16px 30px -12px rgba(201,151,31,1); }
  .btn:active { transform: translateY(0) scale(.97); }
  .btn:focus-visible, a:focus-visible { outline: 3px solid #111827; outline-offset: 3px; }
  .btn svg { width: 22px; height: 22px; flex: none; animation: fly 1.6s ease-in-out infinite; }
  .btn:hover svg { animation-duration: .7s; }
  .cta .btn { animation-delay: .6s; }
  .cta .btn::after { animation-delay: 1.4s; }

  @keyframes pulse {
    0%   { box-shadow: 0 10px 24px -10px rgba(201,151,31,.9), 0 0 0 0 rgba(233,186,75,.55); }
    70%  { box-shadow: 0 10px 24px -10px rgba(201,151,31,.9), 0 0 0 16px rgba(233,186,75,0); }
    100% { box-shadow: 0 10px 24px -10px rgba(201,151,31,.9), 0 0 0 0 rgba(233,186,75,0); }
  }
  @keyframes shine { 0%, 55% { left: -70%; } 100% { left: 130%; } }
  @keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(4px, -3px) rotate(-8deg); } }
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn::after, .btn svg { animation: none !important; transition: none; }
  }

  h2 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: -0.01em; margin: 0 0 18px; text-align: center; }
  .markets { list-style: none; margin: 0 0 36px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .markets li { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px; }
  .markets strong { display: block; font-family: var(--display); font-size: 20px; font-weight: 600; margin-bottom: 2px; }
  .markets span { color: var(--muted); font-size: 14.5px; line-height: 1.4; display: block; }
  .markets li:nth-child(4) { border-color: var(--gold-soft); }

  .cta { text-align: center; padding-bottom: 36px; }
  .disclaimer { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 32px; padding-left: 14px; border-left: 3px solid var(--red); }
  footer { border-top: 1px solid var(--line); padding: 22px 0 30px; color: var(--muted); font-size: 14px; text-align: center; }

  @media (min-width: 820px) { .hero { padding-top: 48px; } .logo { width: 230px; } .wrap { max-width: 620px; } }
</style>
</head>
